name: CI

on:
  push:
    branches: [main, source-first]
  pull_request:
    branches: [main, source-first]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      base_ref: ${{ steps.changes.outputs.base_ref }}
      head_ref: ${{ steps.changes.outputs.head_ref }}
      qudjp_dotnet: ${{ steps.changes.outputs.qudjp_dotnet }}
      roslyn_tools: ${{ steps.changes.outputs.roslyn_tools }}
      python: ${{ steps.changes.outputs.python }}
      localization: ${{ steps.changes.outputs.localization }}
      justfile: ${{ steps.changes.outputs.justfile }}
      markdown_reports: ${{ steps.changes.outputs.markdown_reports }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            base="$(git rev-list --max-parents=0 HEAD)"
            head="${{ github.sha }}"
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            merge_base="$(git merge-base "$base" "$head")"
            git diff --name-only "$merge_base" "$head" > changed-files.txt
          else
            git diff --name-only "$base" "$head" > changed-files.txt
          fi
          if [[ ! -s changed-files.txt ]]; then
            git ls-files > changed-files.txt
          fi

          matches() {
            grep -Eq "$1" changed-files.txt
          }

          matches_python_scripts() {
            awk '/^scripts\// && !/^scripts\/tools\// { found = 1 } END { exit found ? 0 : 1 }' changed-files.txt
          }

          matches_roslyn_python_tests() {
            grep -Eq '^(docs/static-producer-inventory\.json|scripts/(dotnet_tool_runner|extract_annals_patterns|roslyn_semantic_probe|scan_static_producer_inventory|static_producer_closure|text_construction_surface_policy)\.py|scripts/tests/(test_extract_annals_patterns\.py|test_parallel_dotnet_contract\.py|test_roslyn_extractor_smoke\.py|test_roslyn_semantic_probe\.py|test_roslyn_text_construction_inventory\.py|test_scan_static_producer_inventory\.py|test_static_producer_closure\.py|test_text_construction_surface_policy\.py|fixtures/(annals|roslyn_semantic_probe|static_producer_inventory)/))' changed-files.txt
          }

          run_all=false
          qudjp_dotnet=false
          roslyn_tools=false
          python=false
          localization=false
          justfile=false
          markdown_reports=false

          if matches '^\.github/workflows/.*\.ya?ml$'; then
            run_all=true
          fi
          if [[ "$run_all" == true ]] || matches '^Mods/QudJP/Assemblies/'; then
            qudjp_dotnet=true
          fi
          if [[ "$run_all" == true ]] || matches '^scripts/tools/' || matches_roslyn_python_tests || matches '^(pyproject\.toml|uv\.lock)$'; then
            roslyn_tools=true
          fi
          if [[ "$run_all" == true ]] || matches '^(\.codex/hooks/|\.codex/hooks\.json|pyproject\.toml|uv\.lock|dotnet-tools\.json|package(-lock)?\.json|CHANGELOG\.md|Mods/QudJP/manifest\.json|docs/release-notes/)' || matches_python_scripts; then
            python=true
          fi
          if [[ "$run_all" == true ]] || matches '^(Mods/QudJP/Localization/|scripts/(check_translation_tokens|check_glossary_consistency|validate_pattern_routes)\.py|scripts/(translation_token_duplicate_baseline|glossary_consistency_baseline)\.json|justfile$)'; then
            localization=true
          fi
          if [[ "$run_all" == true ]] || matches '^justfile$'; then
            justfile=true
          fi
          if [[ "$run_all" == true ]] || matches '^docs/reports/.*\.md$' || matches '^scripts/check_markdown_reports\.py$'; then
            markdown_reports=true
          fi

          {
            echo "base_ref=$base"
            echo "head_ref=$head"
            echo "qudjp_dotnet=$qudjp_dotnet"
            echo "roslyn_tools=$roslyn_tools"
            echo "python=$python"
            echo "localization=$localization"
            echo "justfile=$justfile"
            echo "markdown_reports=$markdown_reports"
          } >> "$GITHUB_OUTPUT"

  qudjp-dotnet-build:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.qudjp_dotnet == 'true'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-qudjp-${{ hashFiles('Mods/QudJP/Assemblies/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-qudjp-
            ${{ runner.os }}-nuget-

      - name: Build QudJP
        run: dotnet build Mods/QudJP/Assemblies/QudJP.csproj --configuration Release

      - name: Build QudJP.Tests
        if: hashFiles('Mods/QudJP/Assemblies/QudJP.Tests/QudJP.Tests.csproj') != ''
        run: >
          dotnet build Mods/QudJP/Assemblies/QudJP.Tests/QudJP.Tests.csproj
          --configuration Release
          -p:RunAnalyzers=false
          -p:RunAnalyzersDuringBuild=false

      - name: Upload QudJP test artifact
        if: hashFiles('Mods/QudJP/Assemblies/QudJP.Tests/bin/Release/net10.0/QudJP.Tests.dll') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qudjp-tests-release
          path: Mods/QudJP/Assemblies/QudJP.Tests/bin/Release/net10.0
          if-no-files-found: error

  qudjp-dotnet-test:
    name: C# tests (${{ matrix.category }})
    runs-on: ubuntu-latest
    needs: [detect-changes, qudjp-dotnet-build]
    if: always() && needs.detect-changes.outputs.qudjp_dotnet == 'true' && needs.qudjp-dotnet-build.result == 'success'
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        category: [L1, L2, L2G]

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download QudJP test artifact
        uses: actions/download-artifact@v4
        with:
          name: qudjp-tests-release
          path: Mods/QudJP/Assemblies/QudJP.Tests/bin/Release/net10.0

      - name: Test QudJP ${{ matrix.category }}
        run: >
          dotnet test Mods/QudJP/Assemblies/QudJP.Tests/bin/Release/net10.0/QudJP.Tests.dll
          --filter "TestCategory=${{ matrix.category }}"
          --logger "trx;LogFileName=qudjp-${{ matrix.category }}.trx"
          --results-directory TestResults/qudjp-${{ matrix.category }}

      - name: Upload QudJP ${{ matrix.category }} test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qudjp-test-results-${{ matrix.category }}
          path: TestResults/qudjp-${{ matrix.category }}/*.trx
          if-no-files-found: ignore

  roslyn-tools:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.roslyn_tools == 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-roslyn-tools-${{ hashFiles('scripts/tools/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-roslyn-tools-
            ${{ runner.os }}-nuget-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python test tools
        run: pip install pytest

      - name: Build script tools
        if: hashFiles('scripts/tools/**/*.csproj') != ''
        run: |
          python - <<'PY'
          from pathlib import Path

          from scripts.dotnet_tool_runner import build_tool_project

          projects = sorted(Path("scripts/tools").glob("**/*.csproj"))
          if not projects:
              print("No script tool projects found.")
          for project in projects:
              print(f"::group::dotnet build {project}")
              print(build_tool_project(project))
              print("::endgroup::")
          PY

      - name: Test Roslyn-backed Python tools
        run: >
          pytest
          scripts/tests/test_extract_annals_patterns.py
          scripts/tests/test_parallel_dotnet_contract.py
          scripts/tests/test_roslyn_extractor_smoke.py
          scripts/tests/test_roslyn_semantic_probe.py
          scripts/tests/test_roslyn_text_construction_inventory.py
          scripts/tests/test_scan_static_producer_inventory.py
          scripts/tests/test_static_producer_closure.py
          scripts/tests/test_text_construction_surface_policy.py
          -q
          --durations=20

  python:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Node tool dependencies
        run: npm ci

      - name: Add Node tool binaries to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install Python test tools
        run: pip install hypothesis pytest ruff uv

      - name: Lint Python
        if: hashFiles('scripts/**/*.py') != ''
        run: ruff check scripts/

      - name: Test Python
        if: hashFiles('scripts/tests/**/*.py') != ''
        run: >
          pytest scripts/tests/
          --ignore=scripts/tests/test_extract_annals_patterns.py
          --ignore=scripts/tests/test_parallel_dotnet_contract.py
          --ignore=scripts/tests/test_roslyn_extractor_smoke.py
          --ignore=scripts/tests/test_roslyn_semantic_probe.py
          --ignore=scripts/tests/test_roslyn_text_construction_inventory.py
          --ignore=scripts/tests/test_scan_static_producer_inventory.py
          --ignore=scripts/tests/test_static_producer_closure.py
          --ignore=scripts/tests/test_text_construction_surface_policy.py
          --durations=30

      - name: Check CHANGELOG release links
        run: python scripts/release_notes.py check-changelog-links

  localization:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.localization == 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check release-note fragment
        if: github.event_name == 'pull_request'
        run: >
          python scripts/release_notes.py check-fragment
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Check translation tokens
        if: hashFiles('Mods/QudJP/Localization/**/*.ja.json') != ''
        run: python scripts/check_translation_tokens.py Mods/QudJP/Localization

      - name: Check glossary consistency
        if: hashFiles('Mods/QudJP/Localization/**/*') != ''
        run: python scripts/check_glossary_consistency.py Mods/QudJP/Localization

      - name: Check message pattern routes
        if: hashFiles('Mods/QudJP/Localization/Dictionaries/messages.ja.json') != ''
        run: >
          python scripts/validate_pattern_routes.py
          Mods/QudJP/Localization/Dictionaries/messages.ja.json
          --require-needs-harmony-patch-deferrals
          --expect-count message-frame=53
          --expect-count popup=24
          --expect-count journal=1
          --expect-count leaf=0
          --expect-count emit-message=386
          --expect-count does-verb=0
          --expect-count message-log=1
          --expect-count description=14
          --expect-count effect-cripple=1
          --expect-count needs-harmony-patch=0
          --expect-count unclassified=0

  justfile:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.justfile == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Check justfile
        run: just --summary

  markdown-reports:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.markdown_reports == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check Markdown reports
        run: >
          python scripts/check_markdown_reports.py
          --base-ref "${{ needs.detect-changes.outputs.base_ref }}"
          --head-ref "${{ needs.detect-changes.outputs.head_ref }}"

  build:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - qudjp-dotnet-build
      - qudjp-dotnet-test
      - roslyn-tools
      - python
      - localization
      - justfile
      - markdown-reports
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail

          failed=0
          check_result() {
            local job_name="$1"
            local result="$2"

            case "$result" in
              success|skipped)
                ;;
              *)
                printf '%s ended with result: %s\n' "$job_name" "$result" >&2
                failed=1
                ;;
            esac
          }

          check_result detect-changes "${{ needs.detect-changes.result }}"
          check_result qudjp-dotnet-build "${{ needs.qudjp-dotnet-build.result }}"
          check_result qudjp-dotnet-test "${{ needs.qudjp-dotnet-test.result }}"
          check_result roslyn-tools "${{ needs.roslyn-tools.result }}"
          check_result python "${{ needs.python.result }}"
          check_result localization "${{ needs.localization.result }}"
          check_result justfile "${{ needs.justfile.result }}"
          check_result markdown-reports "${{ needs.markdown-reports.result }}"

          exit "$failed"
